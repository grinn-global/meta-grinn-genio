pcm.earphone_speaker {
    type hooks
    slave.pcm {
        type plug
        slave {
            pcm "hw:mt8366evk,0"
            channels 2
        }
    }
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "ADDA_DL_CH1 DL0_CH1"
                preserve true
                value true
            }
            {
                name "ADDA_DL_CH2 DL0_CH2"
                preserve true
                value true
            }
            {
                name "HPL Mux"
                preserve true
                value "Audio Playback"
            }
        ]
    }
}

