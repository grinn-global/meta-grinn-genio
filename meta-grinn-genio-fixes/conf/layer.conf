# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-genio-fixes"
BBFILE_PATTERN_meta-grinn-genio-fixes = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-genio-fixes = "10"

LAYERDEPENDS_meta-grinn-genio-fixes = "core"
LAYERSERIES_COMPAT_meta-grinn-genio-fixes = "kirkstone"
