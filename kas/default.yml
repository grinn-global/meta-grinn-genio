header:
  version: 14

distro: rity-demo
target: rity-demo-image
machine: unset

local_conf_header:
  meta-grinn-genio: |
    PACKAGE_CLASSES ?= "package_ipk"
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"

    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"

    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    SKIP_META_SECURITY_SANITY_CHECK = "1"
    CONF_VERSION = "2"
    LICENSE_FLAGS_ACCEPTED = "commercial commercial_libav commercial_x264"
    IMAGE_ROOTFS_EXTRA_SPACE = "200000"
    KERNEL_DEVICETREE_OVERLAYS_AUTOLOAD:genio-700 += "video.dtbo apusys.dtbo"
    KERNEL_DEVICETREE_OVERLAYS_AUTOLOAD:genio-510 += "video.dtbo apusys.dtbo"

bblayers_conf_header:
  meta-grinn-genio: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

