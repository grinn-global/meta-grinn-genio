spec:
  inputs:
    sstate-mirror:
      type: boolean
      default: true
      description: Use shared sstate mirror
    downloads-mirror:
      type: boolean
      default: true
      description: Use shared downloads mirror
    git-mirror:
      type: boolean
      default: true
      description: Use git mirrors
    build-ref:
      default: ""
      description: Use specific pipeline id ("pipeline:12345") as build artifacts

---

include:
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/deploy-public@2
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/workflow@2
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/build@2
    inputs:
      image-name: ghcr.io/siemens/kas/kas:5.2-debian-bookworm
      sstate-mirror: $[[ inputs.sstate-mirror ]]
      downloads-mirror: $[[ inputs.downloads-mirror ]]
      git-mirror: $[[ inputs.git-mirror ]]
      build-ref: $[[ inputs.build-ref ]]
  - component: $CI_SERVER_FQDN/grinn/ci/yocto/kas/lava@1

stages:
  - ci-kas
  - build
  - test
  - deploy

.ci_matrix: &ci_matrix
  parallel:
    matrix:
      - KAS_MACHINE: grinn-genio-510-sbc
        KAS_CONFIG:
          - default
          - default:nda
          - default:nda:deepx

      - KAS_MACHINE: grinn-genio-700-sbc
        KAS_CONFIG:
          - default
          - default:nda
          - default:nda:deepx

      - KAS_MACHINE: grinn-genio-700-evb
        KAS_CONFIG:
          - default
          - default:nda

.ci_build_artifacts: &ci_build_artifacts
  artifacts:
    expire_in: 1d
    paths:
      - build.env
      - build.log
      - build/tmp/deploy/images/*/*.rootfs.aiotflash.tar.zst
      - build/tmp/deploy/images/*/*.rootfs.aiotflash.tar.zst.sha256sum
      - build/tmp/deploy/images/*/*.rootfs.tar.zst
      - build/tmp/deploy/images/*/fitImage-*.bin

build:
  <<: *ci_build_artifacts
  <<: *ci_matrix
  variables:
    KAS_TARGET: rity-demo-image

build-download:
  <<: *ci_build_artifacts
  <<: *ci_matrix
  variables:
    JOB_NAME: "build: [$KAS_MACHINE, $KAS_CONFIG]"

lava:
  <<: *ci_matrix
  needs:
    - lava-pre
    - job: build
      artifacts: true
      optional: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
            KAS_CONFIG: ['$[[ matrix.KAS_CONFIG ]]']
    - job: build-download
      artifacts: true
      optional: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
            KAS_CONFIG: ['$[[ matrix.KAS_CONFIG ]]']

deploy-public:
  <<: *ci_matrix
  variables:
    KAS_TARGET: rity-demo-image
    DEPLOY_PUBLIC_FILE: build/tmp/deploy/images/$KAS_MACHINE/$KAS_TARGET-$KAS_MACHINE.rootfs.aiotflash.tar.zst
  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - KAS_MACHINE: ['$[[ matrix.KAS_MACHINE ]]']
            KAS_CONFIG: ['$[[ matrix.KAS_CONFIG ]]']
