# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-grinn-genio-bsp"
BBFILE_PATTERN_meta-grinn-genio-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-grinn-genio-bsp = "10"

LAYERDEPENDS_meta-grinn-genio-bsp = " \
	core \
	mediatek-bsp \
"
LAYERSERIES_COMPAT_meta-grinn-genio-bsp = "scarthgap"

